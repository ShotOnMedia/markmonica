services:
  app:
    build:
      context: .
    image: ${MARKMONICA_IMAGE:-markmonica:0.2.0}
    restart: unless-stopped
    env_file:
      - .env
    networks:
      default:
      proxy:
        aliases:
          - markmonica-app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
    image: ${MARKMONICA_IMAGE:-markmonica:0.2.0}
    restart: unless-stopped
    command: ["python", "-m", "worker.main"]
    healthcheck:
      disable: true
    environment:
      RUN_MIGRATIONS: "0"
    env_file:
      - .env
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-markmonica}
      POSTGRES_USER: ${POSTGRES_USER:-markmonica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-markmonica}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-markmonica} -d ${POSTGRES_DB:-markmonica}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

networks:
  proxy:
    external: true
