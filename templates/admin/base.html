<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Admin{% endblock %} · Memories' Events</title>
  <link rel="icon" href="/brand/favicon">
  <link rel="stylesheet" href="/brand.css">
  <link rel="stylesheet" href="/static/admin.css">
</head>
<body>
<div class="admin-shell">
  <aside class="admin-sidebar">
    <a class="admin-brand" href="/admin"><img src="/brand/logo" alt="Platform logo"><span>Platform Admin</span></a>
    <nav>
      <a class="{{ 'active' if section == 'dashboard' else '' }}" href="/admin">Overview</a>
      <a class="{{ 'active' if section == 'users' else '' }}" href="/admin/users">Users</a>
      <a class="{{ 'active' if section == 'events' else '' }}" href="/admin/events">Events</a>
      <a class="{{ 'active' if section == 'media' else '' }}" href="/admin/media">Media & storage</a>
      <a class="{{ 'active' if section == 'packages' else '' }}" href="/admin/packages">Packages</a>
      <a class="{{ 'active' if section == 'branding' else '' }}" href="/admin/branding">Branding</a>
      <a class="{{ 'active' if section == 'analytics' else '' }}" href="/admin/analytics">Analytics</a>
      <a class="{{ 'active' if section == 'activity' else '' }}" href="/admin/activity">Activity log</a>
      <span class="nav-disabled">System <small>Next</small></span>
    </nav>
    <div class="admin-sidebar-foot"><strong>{{ admin.display_name }}</strong><span>{{ admin.email }}</span><a href="/dashboard">Host dashboard →</a></div>
  </aside>
  <main class="admin-main">
    <header class="admin-top"><div><span class="eyebrow">Memories' Events</span><h1>{% block heading %}Platform Admin{% endblock %}</h1></div><span class="admin-pill">Administrator</span></header>
    {% block content %}{% endblock %}
  </main>
</div>
</body>
</html>
