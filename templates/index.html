<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f5f2">
    <title>{{ app_name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
</head>
<body>
    <main class="shell">
        <section class="card" aria-labelledby="markmonica-title">
            <p class="eyebrow">Event memories, made simple</p>
            <h1 id="markmonica-title">{{ app_name }}</h1>
            <p class="tagline">One QR code. Every guest's memories, together.</p>
            <div class="status"><span class="status-dot" aria-hidden="true"></span>v{{ version }} foundation is running</div>
        </section>
    </main>
</body>
</html>
