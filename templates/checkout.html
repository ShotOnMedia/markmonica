<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secure checkout · Memories' Events</title><link rel="stylesheet" href="/static/app.css"><link rel="stylesheet" href="/brand.css"></head><body><main class="dashboard package-shop"><section class="panel"><p class="eyebrow">Secure checkout</p><h1>{{ package.name }}</h1><p>For <strong>{{ event.title }}</strong></p><div class="commercial-limit"><strong>{{ order.currency }} {{ "%.2f"|format(order.amount_cents / 100) }}</strong><span>once-off</span></div><p class="muted-copy">You'll continue to Payfast to complete payment securely. Your package is activated only after the payment notification is verified.</p><form method="post" action="/events/{{ event.id }}/orders/{{ order.id }}/checkout"><button type="submit">Continue to Payfast</button></form><a class="button-link secondary-link" href="/events/{{ event.id }}/packages">Back to packages</a></section></main></body></html>
