<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ event.title }} · MarkMonica</title><link rel="stylesheet" href="/static/app.css"></head>
<body><main class="dashboard"><header class="dashboard-header"><div><a class="brand" href="/dashboard">← MarkMonica</a><p class="muted">Event management</p></div><span class="pill">{{ event.status }}</span></header><section class="manage-grid"><article class="panel"><p class="eyebrow">Event details</p><h1>{{ event.title }}</h1><form method="post"><label>Event name<input name="title" value="{{ event.title }}" required></label><label>Event date<input type="date" name="event_date" value="{{ event.event_date or '' }}"></label><label>Event status<select name="status"><option value="draft" {% if event.status == 'draft' %}selected{% endif %}>Draft</option><option value="live" {% if event.status == 'live' %}selected{% endif %}>Live</option></select></label><button type="submit">Save changes</button></form></article><aside class="panel qr-panel"><p class="eyebrow">Guest access</p><h2>Your event QR code</h2><img class="qr" src="/events/{{ event.id }}/qr.png" alt="QR code for {{ event.title }}"><p class="muted">Guests scan this code to open the event without creating an account.</p><input class="url-field" value="{{ guest_url }}" readonly><div class="actions"><a class="button-link" href="{{ guest_url }}" target="_blank">Open guest page</a><a class="button-link secondary-link" href="/events/{{ event.id }}/qr.png" download>Download QR</a></div></aside></section></main></body></html>
