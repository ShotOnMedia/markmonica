<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account · MarkMonica</title><link rel="stylesheet" href="/static/app.css"></head>
<body><main class="card auth-card"><a class="brand" href="/">MarkMonica</a><h1>Create your host account</h1><p>Start an event and collect every guest's memories in one place.</p>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post"><label>Your name<input name="display_name" autocomplete="name" required></label><label>Email<input type="email" name="email" autocomplete="email" required></label><label>Password<input type="password" name="password" minlength="8" autocomplete="new-password" required></label><button type="submit">Create account</button></form><p class="muted">Already registered? <a href="/login">Sign in</a></p></main></body></html>
