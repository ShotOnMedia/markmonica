<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard · MarkMonica</title><link rel="stylesheet" href="/static/app.css"></head>
<body><main class="dashboard"><header class="dashboard-header"><div><a class="brand" href="/">MarkMonica</a><p class="muted">Signed in as {{ user.display_name }}</p></div><form method="post" action="/logout"><button class="secondary" type="submit">Sign out</button></form></header><section class="panel"><h1>Your events</h1><form class="event-form" method="post" action="/events"><label>Event name<input name="title" placeholder="Mark & Monica's Wedding" required></label><label>Event date<input type="date" name="event_date"></label><button type="submit">Create event</button></form></section><section class="event-grid">{% for event in events %}<article class="event-card"><span class="pill">{{ event.status }}</span><h2>{{ event.title }}</h2><p>{{ event.event_date or 'Date not set' }}</p><code>/e/{{ event.slug }}</code></article>{% else %}<article class="empty"><h2>No events yet</h2><p>Create your first event above. The guest QR experience comes next.</p></article>{% endfor %}</section></main></body></html>
