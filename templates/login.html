<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Memories' Events</title><link rel="icon" href="/brand/favicon"><link rel="stylesheet" href="/static/app.css"><link rel="stylesheet" href="/static/brand.css"><script src="/static/password-visibility.js" defer></script></head>
<body><main class="card auth-card"><a class="site-brand" href="/" aria-label="Memories' Events home"><img class="site-brand-logo" src="/brand/logo" alt="Platform logo"></a><h1>Welcome back</h1><p>Sign in to manage your events and guest galleries.</p>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post"><label>Email<input type="email" name="email" autocomplete="email" required></label><label>Password<span class="password-input"><input id="login-password" type="password" name="password" autocomplete="current-password" required><button class="password-visibility" type="button" data-password-visibility aria-controls="login-password" aria-label="Show password" aria-pressed="false" title="Show password"><svg class="password-visibility-show" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.75"/></svg><svg class="password-visibility-hide" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="m3 3 18 18M10.6 6.1A9.7 9.7 0 0 1 12 6c6 0 9.5 6 9.5 6a16.8 16.8 0 0 1-2.3 3M6.2 6.2C3.8 8 2.5 12 2.5 12s3.5 6 9.5 6a9.4 9.4 0 0 0 4-.9M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button></span></label><button type="submit">Sign in</button></form><p class="muted">New to Memories' Events? <a href="/register">Create an account</a></p></main></body></html>
